# Resilio Configuration
# Non-secret settings for the application

# File paths (relative to repository root)
paths:
  athlete_dir: "data/athlete"
  activities_dir: "data/activities"
  metrics_dir: "data/metrics"
  plans_dir: "data/plans"
  state_dir: "data/state"

# Strava API configuration
strava:
  api_base_url: "https://www.strava.com/api/v3"
  token_url: "https://www.strava.com/oauth/token"
  auth_url: "https://www.strava.com/oauth/authorize"
  scopes:
    - "read"
    - "activity:read_all"
  history_import_weeks: 52  # How many weeks to import on first setup

# Training calculation defaults
training_defaults:
  ctl_time_constant: 42      # days (Chronic Training Load)
  atl_time_constant: 7       # days (Acute Training Load)
  acwr_acute_window: 7       # days
  acwr_chronic_window: 28    # days
  baseline_days_threshold: 14  # days before baseline_established = true
  acwr_minimum_days: 28      # minimum days before ACWR is calculated

# System settings
system:
  lock_timeout_ms: 300000    # 5 minutes
  lock_retry_count: 3
  lock_retry_delay_ms: 2000
  metrics_stale_hours: 24

# Google Calendar (resilio calendar sync). Timezone drives event offsets (DST-aware).
google_calendar:
  timezone: Europe/Prague    # athlete's current location (Prague semester); was America/Toronto
  # Prague class schedule: Mon 10:45-14:00 + 17:45-21:00, Tue 8:30-18:30, Wed 11:30-17:30.
  # Runs before class, gym in the free window after; >=4 h between a run and a gym session.
  run_day_times: {"0": "08:30", "1": "07:00", "2": "09:00", "3": "09:00", "4": "09:00", "5": "09:00", "6": "09:00"}
  strength_day_times: {"0": "14:30", "1": "19:00", "2": "18:00", "3": "15:00", "4": "15:00", "5": "15:00", "6": "15:00"}
